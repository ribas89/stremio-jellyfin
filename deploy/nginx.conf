server {
    listen 80;
    server_name addon.example.com;
    # Paths can contain encoded API keys. Do not store them in access logs.
    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name addon.example.com;
    # Allow long credential-bearing install URLs and avoid logging them.
    large_client_header_buffers 4 64k;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/addon.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/addon.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Some install URLs contain long encoded credential tokens.
        proxy_buffers 8 64k;
        proxy_buffer_size 64k;

        proxy_redirect default;

        # Allow slow addon responses. Media playback itself is handled by Jellyfin.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}