name: Publish Stremio Jellyfin Package

# Run manually from the default branch. Version comes from package.json.
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: stremio-jellyfin-release
  cancel-in-progress: false

jobs:
  publish:
    name: Test, build and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release only from the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow from the default branch ($DEFAULT_BRANCH)."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Read version from package.json
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          ROOT_LOCK_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"

          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::package.json version must be X.Y.Z (for example 1.2.3).'
            exit 1
          fi
          if [[ "$VERSION" != "$LOCK_VERSION" || "$VERSION" != "$ROOT_LOCK_VERSION" ]]; then
            echo '::error::package-lock.json does not match package.json. Run npm install to sync it.'
            exit 1
          fi

          TAG="v${VERSION}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "image=$IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $IMAGE:$TAG and $IMAGE:latest"

      - name: Verify the release tag is available
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the version in package.json."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_COMMIT="$(git rev-parse "$TAG^{commit}")"
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $TAG already points to a different commit ($TAG_COMMIT)."
              exit 1
            fi
            echo "Tag $TAG already points to this commit. Resuming an incomplete release."
          fi

      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=Stremio Jellyfin
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Stremio Jellyfin $TAG" \
            --generate-notes \
            --latest

      - name: Publish summary
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          {
            echo "### Stremio Jellyfin $TAG published"
            echo "- Docker: \`$IMAGE:$TAG\`"
            echo "- Docker: \`$IMAGE:latest\`"
            echo "- Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
